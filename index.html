<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neural Tac-Toe | AI Trainer</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Outfit', sans-serif; }

    .glass {
      background: rgba(30,41,59,0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .cell {
      transition: 0.2s;
    }
    .cell:active {
      transform: scale(0.92);
    }

    .chat-bubble { max-width: 85%; }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-6xl flex flex-col lg:flex-row gap-6 h-[90vh]">

  <!-- GAME -->
  <div class="flex-1 glass rounded-3xl p-6 flex flex-col">
    <h1 class="text-4xl font-bold text-center mb-6 text-blue-400">
      Neural Tac-Toe
    </h1>

    <h2 id="status" class="text-center text-xl mb-4">Your Turn</h2>

    <div class="grid grid-cols-3 gap-3 max-w-[360px] mx-auto mb-auto">
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(0)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(1)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(2)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(3)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(4)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(5)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(6)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(7)"></button>
      <button class="cell w-24 h-24 bg-slate-800 rounded-2xl text-5xl" onclick="move(8)"></button>
    </div>

    <button onclick="resetGame()"
      class="mt-6 bg-slate-800 hover:bg-slate-700 p-3 rounded-xl font-bold">
      Reset Game
    </button>
  </div>

  <!-- CHAT -->
  <div class="w-full lg:w-[400px] glass rounded-3xl flex flex-col">
    <div class="p-4 border-b border-slate-700 font-bold flex items-center gap-2">
      🤖 AI Chat
    </div>

    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

    <div class="p-3 flex gap-2">
      <input id="chatInput"
        placeholder="Type a message..."
        class="flex-1 bg-slate-900 rounded-xl px-3 py-2 outline-none"
        onkeypress="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()"
        class="bg-blue-600 hover:bg-blue-500 px-4 rounded-xl font-bold">
        ➤
      </button>
    </div>
  </div>

</div>

<script>
/* ======================
   CONFIG
====================== */

// 🔴 REPLACE THIS AFTER BACKEND DEPLOY
const BACKEND_URL = "https://YOUR-BACKEND.onrender.com/chat";

/* ======================
   GAME LOGIC
====================== */

const cells = document.querySelectorAll(".cell");
const statusEl = document.getElementById("status");
const chatBox = document.getElementById("chatBox");

let board = Array(9).fill(null);
let gameOver = false;

function move(i) {
  if (board[i] || gameOver) return;

  board[i] = "X";
  cells[i].textContent = "X";

  if (checkWin("X")) return endGame("You win!");
  aiMove();
}

function aiMove() {
  const i = board.findIndex(v => v === null);
  if (i === -1) return endGame("Draw");

  board[i] = "O";
  cells[i].textContent = "O";

  if (checkWin("O")) return endGame("AI wins!");
}

function checkWin(m) {
  const wins = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return wins.some(w => w.every(i => board[i] === m));
}

function endGame(msg) {
  statusEl.textContent = msg;
  gameOver = true;
  askAI(msg);
}

function resetGame() {
  board.fill(null);
  cells.forEach(c => c.textContent = "");
  statusEl.textContent = "Your Turn";
  gameOver = false;
}

/* ======================
   CHAT
====================== */

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className =
    role === "user"
      ? "chat-bubble ml-auto bg-blue-600 p-2 rounded-xl"
      : "chat-bubble mr-auto bg-slate-700 p-2 rounded-xl";
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;

  addMsg("user", msg);
  input.value = "";

  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: msg,
      board: board.map(v => v || "-").join("")
    })
  });

  const data = await res.json();
  addMsg("ai", data.reply || "...");
}

function askAI(event) {
  fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: `Game event: ${event}`,
      board: board.map(v => v || "-").join("")
    })
  })
    .then(r => r.json())
    .then(d => addMsg("ai", d.reply));
}
</script>

</body>
</html>
